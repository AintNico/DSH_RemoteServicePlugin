plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aint.dshremote'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aint.dshremote'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // QR decoding for the in-app scanner; pure Java, no AndroidX.
    implementation 'com.google.zxing:core:3.5.3'
}
